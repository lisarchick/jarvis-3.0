name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: release-cargo-${{ runner.os }}-

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build installer (NSIS + MSI) and portable exe
        run: npm run tauri build

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          VERSION=${GITHUB_REF_NAME#v}
          cp src-tauri/target/release/bundle/nsis/*.exe "release/Jarvis_${VERSION}_x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "release/Jarvis_${VERSION}_x64.msi" || true
          cp src-tauri/target/release/Jarvis.exe "release/Jarvis-Portable-${VERSION}.exe"
          ls -la release/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Jarvis_*-setup.exe
            release/Jarvis_*.msi
            release/Jarvis-Portable-*.exe
