name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: release-cargo-${{ runner.os }}-

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build installer (NSIS + MSI) and portable exe
        run: npm run tauri build

      - name: Collect Windows artifacts
        shell: bash
        run: |
          mkdir -p release-win
          VERSION=${GITHUB_REF_NAME#v}
          cp src-tauri/target/release/bundle/nsis/*.exe "release-win/Jarvis_${VERSION}_Windows_x64-setup.exe"
          cp src-tauri/target/release/bundle/msi/*.msi "release-win/Jarvis_${VERSION}_Windows_x64.msi" || true
          cp src-tauri/target/release/Jarvis.exe "release-win/Jarvis-Portable-${VERSION}_Windows.exe"
          ls -la release-win/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release-win/*

  build-ios:
    runs-on: macos-latest
    # iOS-сборка не должна блокировать релиз Windows.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-cargo-${{ runner.os }}-ios-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: release-cargo-${{ runner.os }}-ios-

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend deps
        run: npm ci

      # Главная проверка: Rust-ядро обязано компилироваться под iOS.
      - name: Rust check for iOS (aarch64-apple-ios)
        run: cargo check --target aarch64-apple-ios --manifest-path src-tauri/Cargo.toml

      - name: Init Xcode project
        run: npx tauri ios init

      - name: Inject iOS usage permissions (Info.plist)
        run: |
          PLIST=$(find src-tauri/gen/apple -maxdepth 3 -path "*_iOS/Info.plist" 2>/dev/null | head -1)
          echo "plist: $PLIST"
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Микрофон нужен для голосовых команд JARVIS" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string Распознавание речи для голосовых запросов" "$PLIST" || true
            /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST"
          fi

      # Симуляторная сборка не требует подписи Apple Developer.
      - name: Build iOS app for simulator
        run: npx tauri ios build --target aarch64-sim

      - name: Collect iOS artifacts
        shell: bash
        run: |
          mkdir -p release-ios
          VERSION=${GITHUB_REF_NAME#v}
          APP=$(find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -1 || true)
          if [ -n "$APP" ]; then
            cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/release-ios/Jarvis-${VERSION}_iOS_Simulator.app.zip" "$(basename "$APP")" && cd "$GITHUB_WORKSPACE"
          fi
          cp docs/IOS-BUILD.md "release-ios/Jarvis-${VERSION}_iOS-ИНСТРУКЦИЯ.md" 2>/dev/null || cp docs/IOS-BUILD.md release-ios/ || true
          ls -la release-ios/ || true

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: release-ios/*
          if-no-files-found: ignore

  release:
    needs: [build-windows, build-ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-artifacts
          path: release
        continue-on-error: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*
