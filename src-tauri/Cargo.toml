[package]
name = "jarvis3"
version = "3.0.0"
description = "JARVIS 3.0 — голосовой ИИ-агент для Windows на Rust/Tauri"
authors = ["Platon Kochanov"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "jarvis3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-stream = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = true, features = ["json", "stream", "gzip", "multipart"] }
regex = "1"
once_cell = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rodio = "0.23"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
sha2 = "0.10"
base64 = "0.22"
percent-encoding = "2"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_Security_Cryptography",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
